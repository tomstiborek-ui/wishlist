<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noimageindex">
<meta name="theme-color" content="#ffffff">
<title>Dárky · Bohoušek & Boženka</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css?v=6">
</head>
<body>

<header class="hdr" id="hdr">
  <div class="hdr-in">
    <a class="logo" href="#" aria-label="Dárky – domů">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg>
      <span>dárky</span>
    </a>
    <nav class="tabs" id="who-tabs" aria-label="Pro koho"></nav>
    <div class="hdr-r">
      <button class="ghost-round add-top" type="button" data-act="add">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Přidat přání
      </button>
    </div>
  </div>
  <div class="pill-wrap">
    <div class="pill" role="group" aria-label="Filtry">
      <button class="pill-seg" type="button" data-open-filter="cat"><b>Kategorie</b><span id="sp-cat">Vše</span></button>
      <span class="pill-sep"></span>
      <button class="pill-seg" type="button" data-open-filter="price"><b>Cena</b><span id="sp-price">Jakákoli</span></button>
      <span class="pill-sep"></span>
      <button class="pill-seg" type="button" data-open-filter="sort"><b>Řazení</b><span id="sp-sort">Nejnovější</span></button>
      <button class="pill-go" type="button" data-open-filter="" aria-label="Všechny filtry">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="page" id="list">
  <p class="demo" id="demo" hidden>Ukázkový režim: data se ukládají jen v tomto prohlížeči.</p>
  <div class="res-head">
    <div>
      <h1 id="res-title">Přání</h1>
      <p class="res-sub" id="res-sub"></p>
    </div>
    <button class="filter-btn" type="button" data-open-filter="">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
      Filtry<span class="badge" id="f-badge" hidden></span>
    </button>
  </div>
  <div class="grid" id="grid"></div>
  <div id="empty"></div>
</main>

<main class="page detail" id="detail" hidden></main>

<button class="float-add" type="button" data-act="add" id="fab">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  Přidat přání
</button>

<!-- Filters -->
<dialog class="modal" id="dlg-filter" aria-labelledby="flt-title">
  <div class="m-head"><button class="x" type="button" data-close aria-label="Zavřít">✕</button><h2 id="flt-title">Filtry</h2><span></span></div>
  <div class="m-body" id="flt-body"></div>
  <div class="m-foot"><button class="ulink" type="button" id="flt-clear">Zrušit vše</button><button class="btn-dark" type="button" id="flt-apply">Zobrazit</button></div>
</dialog>

<!-- Add / edit -->
<dialog class="modal" id="dlg-edit" aria-labelledby="edit-title">
  <form id="edit-form" novalidate>
    <div class="m-head"><button class="x" type="button" data-close aria-label="Zavřít">✕</button><h2 id="edit-title">Nové přání</h2><span></span></div>
    <div class="m-body">
      <section class="sec">
        <h3>Pro koho</h3>
        <div class="seg-box" id="e-for" role="group" aria-label="Pro koho">
          <button type="button" data-for="bohousek" aria-pressed="false">Bohoušek</button>
          <button type="button" data-for="bozenka" aria-pressed="false">Boženka</button>
        </div>
      </section>
      <section class="sec">
        <h3>Co si přeješ</h3>
        <div class="fgroup">
          <label class="fbox"><span>Název</span><input id="e-name" required maxlength="200" placeholder="Např. kožené rukavice"></label>
          <div class="frow2">
            <label class="fbox"><span>Cena (Kč)</span><input id="e-price" type="number" inputmode="numeric" min="0" step="1" placeholder="Přibližně"></label>
            <label class="fbox"><span>Kategorie</span><input id="e-cat" list="cat-list" maxlength="40" placeholder="Vyber níže nebo napiš"></label>
          </div>
          <label class="fbox"><span>Odkaz, kde koupit</span><input id="e-url" type="url" inputmode="url" placeholder="https://…"></label>
          <label class="fbox"><span>Poznámka</span><textarea id="e-note" maxlength="1000" placeholder="Velikost, barva, varianta…"></textarea></label>
        </div>
        <div class="tiles small" id="e-cat-tiles"></div>
      </section>
      <section class="sec">
        <h3>Fotky</h3>
        <p class="hint">Max. 6 fotek, první je hlavní. Můžeš je sem přetáhnout nebo vložit (Cmd+V).</p>
        <div class="picks" id="e-picks"></div>
        <input id="e-files" type="file" accept="image/*" multiple hidden>
      </section>
      <div class="msg" id="edit-msg" role="status"></div>
    </div>
    <div class="m-foot">
      <button class="ulink danger" type="button" id="e-delete" hidden>Smazat přání</button><span id="e-del-sp"></span>
      <button class="btn-dark" type="submit" id="e-save">Uložit</button>
    </div>
  </form>
</dialog>
<datalist id="cat-list"></datalist>

<!-- All photos -->
<dialog class="tour" id="dlg-tour" aria-label="Všechny fotky">
  <div class="tour-head"><button class="circle" type="button" data-close aria-label="Zavřít">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button><span id="tour-count"></span><span></span></div>
  <div class="tour-body" id="tour-body"></div>
</dialog>

<div class="toast" id="toast" role="status" hidden></div>

<script src="app.js?v=6"></script>
</body>
</html>
