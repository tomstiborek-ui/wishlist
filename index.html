<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noimageindex">
<title>Dárky · Bohoušek & Boženka</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Login: shared password + who you are -->
<div class="gate" id="gate" hidden>
  <form class="gate-card" id="gate-form">
    <div><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg></div>
    <div><h1>Dárky</h1><p>Přání Bohouška a Boženky</p></div>
    <div class="whos" role="group" aria-label="Kdo jsi?">
      <button type="button" data-who="bohousek" aria-pressed="false"><span class="avatar bohousek">B</span>Bohoušek</button>
      <button type="button" data-who="bozenka" aria-pressed="false"><span class="avatar bozenka">B</span>Boženka</button>
    </div>
    <input id="gate-pass" type="password" placeholder="Heslo" autocomplete="current-password" aria-label="Heslo">
    <button class="btn primary" type="submit">Vstoupit</button>
    <div class="msg" id="gate-msg" role="status"></div>
  </form>
</div>

<div class="wrap" id="app" hidden>
  <header class="top">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg>
      <h1>Dárky</h1>
    </div>
    <div class="me">
      <button class="btn primary add-top" type="button" data-act="add">+ Přidat přání</button>
      <button class="who-chip" type="button" id="who-chip" title="Odhlásit / přepnout"></button>
    </div>
  </header>

  <p class="demo" id="demo" hidden>Ukázkový režim: data se ukládají jen v tomto prohlížeči. Sdílená data začnou fungovat po připojení Supabase (viz README).</p>

  <section class="filters" aria-label="Filtry">
    <div class="frow">
      <span class="label">Pro koho</span>
      <div class="seg" id="f-who"></div>
    </div>
    <div class="frow">
      <span class="label">Kategorie</span>
      <div class="chips" id="f-cat"></div>
    </div>
    <div class="frow">
      <span class="label">Cena</span>
      <div class="chips" id="f-price"></div>
      <div class="price-range">
        <input id="f-min" type="number" inputmode="numeric" min="0" step="100" placeholder="od Kč" aria-label="Cena od">
        <span>–</span>
        <input id="f-max" type="number" inputmode="numeric" min="0" step="100" placeholder="do Kč" aria-label="Cena do">
      </div>
      <div class="fend">
        <label class="check" id="hide-res-wrap"><input type="checkbox" id="f-hideres"> Skrýt zamluvené</label>
        <select class="sort" id="f-sort" aria-label="Řazení">
          <option value="new">Nejnovější</option>
          <option value="cheap">Nejlevnější</option>
          <option value="dear">Nejdražší</option>
          <option value="name">Podle názvu</option>
        </select>
      </div>
    </div>
  </section>

  <div class="resultline"><span id="count"></span><button class="linkish" type="button" id="reset" hidden>Zrušit filtry</button></div>
  <main class="grid" id="grid"></main>
  <div id="empty"></div>
</div>

<button class="btn primary fab" type="button" data-act="add" id="fab" hidden>+ Přidat přání</button>

<!-- Add / edit -->
<dialog id="dlg-edit">
  <form method="dialog" id="edit-form" novalidate>
    <div class="dlg-head"><h2 id="edit-title">Nové přání</h2><button class="icon-btn" type="button" data-close aria-label="Zavřít">✕</button></div>
    <div class="dlg-body">
      <label class="field"><span>Co si přeješ *</span><input id="e-name" required maxlength="200" placeholder="Např. Kožené rukavice"></label>
      <div class="two">
        <label class="field"><span>Cena <small>(přibližně)</small></span><span class="with-suffix"><input id="e-price" type="number" inputmode="numeric" min="0" step="1" placeholder="0"></span></label>
        <label class="field"><span>Kategorie</span><input id="e-cat" list="cat-list" maxlength="40" placeholder="Vyber nebo napiš"></label>
      </div>
      <div class="cat-suggest" id="e-cat-suggest"></div>
      <label class="field"><span>Odkaz, kde koupit</span><input id="e-url" type="url" inputmode="url" placeholder="https://…"></label>
      <label class="field"><span>Poznámka <small>(velikost, barva…)</small></span><textarea id="e-note" maxlength="1000"></textarea></label>
      <div class="field"><span>Fotky <small>(max. 6, první je hlavní)</small></span>
        <div class="picks" id="e-picks"></div>
        <input id="e-files" type="file" accept="image/*" multiple hidden>
      </div>
      <div class="msg" id="edit-msg" role="status"></div>
    </div>
    <div class="dlg-foot">
      <button class="btn danger" type="button" id="e-delete" hidden>Smazat</button>
      <span class="spacer"></span>
      <button class="btn ghost" type="button" data-close>Zrušit</button>
      <button class="btn primary" type="submit" id="e-save">Uložit</button>
    </div>
  </form>
</dialog>
<datalist id="cat-list"></datalist>

<!-- Detail -->
<dialog id="dlg-view"><div id="view"></div></dialog>

<div class="toast" id="toast" role="status" hidden></div>

<script src="app.js"></script>
</body>
</html>
