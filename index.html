<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noimageindex">
<meta name="theme-color" content="#ffffff">
<title>B&amp;B Wishlist · Bohoušek &amp; Boženka</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css?v=22">
</head>
<body>

<header class="hdr" id="hdr">
  <div class="hdr-in">
    <a class="logo" href="#" aria-label="B&amp;B Wishlist – domů">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg>
      <span>B&amp;B Wishlist</span>
    </a>
    <div class="bar" role="search" aria-label="Filtry">
      <label class="seg s1"><b>Pro koho</b>
        <select id="f-who"><option value="all">Oba</option><option value="bohousek">Bohoušek</option><option value="bozenka">Boženka</option></select></label>
      <span class="sep"></span>
      <label class="seg s2"><b>Kategorie</b><select id="f-cat"></select></label>
      <span class="sep"></span>
      <div class="seg s3 price"><b>Cena</b>
        <div class="pr-in"><input id="f-min" type="number" inputmode="numeric" min="0" step="100" placeholder="od" aria-label="Cena od"><span>–</span><input id="f-max" type="number" inputmode="numeric" min="0" step="100" placeholder="do" aria-label="Cena do"><span>Kč</span></div></div>
      <span class="sep"></span>
      <label class="seg s4"><b>Řazení</b>
        <select id="f-sort"><option value="new">Nejnovější</option><option value="cheap">Nejlevnější</option><option value="dear">Nejdražší</option><option value="name">Podle názvu</option></select></label>
      <button class="bar-clear" type="button" data-act="reset" id="f-clear" aria-label="Zrušit filtry" title="Zrušit filtry" hidden>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
<div class="hdr-r">
      <button class="add-top" type="button" data-act="add">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      Přidat přání <svg class="ha" width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path class="l" d="M0 5h7"/><path class="t" d="M1 1l4 4-4 4"/></svg>
    </button>
    </div>
  </div>
</header>

<main class="page" id="list">
  <section class="hero">
    <div class="ribbon" aria-hidden="true"></div>
    <h1 id="res-title">Přání</h1>
    <p class="res-sub" id="res-sub"></p>
    <div class="hero-cta"><button class="btn-primary" type="button" data-act="add">Přidat přání <svg class="ha" width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path class="l" d="M0 5h7"/><path class="t" d="M1 1l4 4-4 4"/></svg></button></div>
  </section>
  <p class="demo" id="demo" hidden>Ukázkový režim: data se ukládají jen v tomto prohlížeči.</p>
  <div class="grid" id="grid"></div>
  <div id="empty"></div>
</main>

<main class="page detail" id="detail" hidden></main>

<button class="float-add" type="button" data-act="add" id="fab">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  Přidat přání
</button>

<!-- Add / edit -->
<dialog class="modal" id="dlg-edit" aria-labelledby="edit-title">
  <form id="edit-form" novalidate>
    <div class="m-head"><button class="x" type="button" data-close aria-label="Zavřít">✕</button><h2 id="edit-title">Nové přání</h2><span></span></div>
    <div class="m-body">
      <section class="sec">
        <h3>Pro koho</h3>
        <div class="seg-box" id="e-for" role="group" aria-label="Pro koho">
          <button type="button" data-for="bohousek" aria-pressed="false">Bohoušek</button>
          <button type="button" data-for="bozenka" aria-pressed="false">Boženka</button>
        </div>
      </section>
      <section class="sec">
        <h3>Co si přeješ</h3>
        <div class="fgroup">
          <label class="fbox"><span>Odkaz, kde koupit</span><input id="e-url" type="url" inputmode="url" placeholder="Vlož odkaz – fotky, název a cena se načtou samy"></label>
          <div class="fetch-row" id="e-fetch" hidden>
            <button class="chip-btn" type="button" id="e-fetch-btn">✨ Načíst fotky z odkazu</button>
            <span id="e-fetch-msg" role="status"></span>
          </div>
          <label class="fbox"><span>Název</span><input id="e-name" required maxlength="200" placeholder="Např. kožené rukavice"></label>
          <label class="fbox"><span>Cena (Kč)</span><input id="e-price" type="number" inputmode="numeric" min="0" step="1" placeholder="Přibližně"></label>
          <label class="fbox"><span>Kategorie</span><input id="e-cat" list="cat-list" maxlength="40" placeholder="Vyber níže nebo napiš"></label>
          <div class="tiles small" id="e-cat-tiles"></div>
          <label class="fbox"><span>Poznámka</span><textarea id="e-note" maxlength="1000" placeholder="Velikost, barva, varianta…"></textarea></label>
        </div>
      </section>
      <section class="sec">
        <h3>Fotky</h3>
        <p class="hint">Max. 6 fotek, první je hlavní. Načtou se samy z odkazu, nebo je sem přetáhni či vlož (Cmd+V).</p>
        <div class="picks" id="e-picks"></div>
        <input id="e-files" type="file" accept="image/*" multiple hidden>
      </section>
      <div class="msg" id="edit-msg" role="status"></div>
    </div>
    <div class="m-foot">
      <button class="ulink danger" type="button" id="e-delete" hidden>Smazat přání</button><span id="e-del-sp"></span>
      <button class="btn-dark" type="submit" id="e-save">Uložit</button>
    </div>
  </form>
</dialog>
<datalist id="cat-list"></datalist>

<!-- All photos -->
<dialog class="tour" id="dlg-tour" aria-label="Všechny fotky">
  <div class="tour-head"><button class="circle" type="button" data-close aria-label="Zavřít">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button><span id="tour-count"></span><span></span></div>
  <div class="tour-body" id="tour-body"></div>
</dialog>

<div class="toast" id="toast" role="status" hidden></div>

<script src="app.js?v=22"></script>
</body>
</html>
